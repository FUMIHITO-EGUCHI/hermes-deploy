# docker-compose.windows.yml — Hermes Agent (Windows + Docker Desktop / WSL2)
#
# Differences vs upstream docker-compose.yml:
#   - network_mode: host removed (not supported on Docker Desktop for Windows).
#   - Explicit ports: dashboard 9119 + API server 8642, both bound to
#     127.0.0.1 only.
#   - State lives in a named Docker volume (`hermes-data`), not a host
#     bind-mount. Tokens in /opt/data/auth.json are unreadable from
#     the host filesystem.
#
# About the hermes-data volume (referenced from both services below):
#   On the host filesystem the volume would expose OAuth refresh tokens
#   in auth.json to anything running as your user (Codex Sandbox group,
#   sync tools, malware running as the user, etc.). Moving it into
#   Docker's storage area (Windows: WSL2 VM ext4; Linux:
#   /var/lib/docker/volumes/) puts it behind the docker socket.
#
# Usage:
#   1. Clone NousResearch/hermes-agent next to this repo (build context).
#   2. Copy this file into the cloned hermes-agent dir, or run with
#      `--project-directory <path-to-hermes-agent>`.
#   3. `docker compose -f docker-compose.windows.yml up -d`
#   4. First-time setup (one-shot, interactive):
#        docker exec -it hermes hermes setup
#        docker exec -it hermes hermes login <provider>
#        docker exec -it hermes hermes gateway setup   # optional, for Discord/etc
#      Credentials land in /opt/data/auth.json inside the volume — host
#      never touches them.
#
# Security notes:
#   - All published ports are bound to 127.0.0.1. LAN can't reach them.
#   - No host-side .env injection. Hermes manages its own credentials in
#     /opt/data/{auth.json,.env} inside the named volume. Back up via
#     `docker exec hermes hermes backup`.

services:
  gateway:
    # Build context is `.` — i.e. the directory you run `docker compose -f
    # docker-compose.windows.yml ...` from. Per the file header, that's the
    # cloned NousResearch/hermes-agent root (Dockerfile + source live there).
    # If you invoke compose with `--project-directory <path>`, that path is
    # what `.` resolves to instead.
    build: .
    image: hermes-agent
    container_name: hermes
    restart: unless-stopped
    volumes:
      - "hermes-data:/opt/data"
    environment:
      - HERMES_UID=10000
      - HERMES_GID=10000
      # API server bind config. Container-internal 0.0.0.0 is required because
      # Docker port-mapping cannot reach a container's loopback. Host exposure
      # is bounded by the `ports:` line below which publishes only to
      # 127.0.0.1. LAN cannot reach this.
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      # Optional: route browser tool calls through the CloakBrowser stealth
      # Chromium sidecar (see the `cloakbrowser` service below). Default is
      # empty → Hermes falls back to its own local headless agent-browser.
      # Enable with: `docker compose --profile browser up -d` (the profile
      # also boots the cloakbrowser service). Default network DNS resolves
      # `hermes-cloakbrowser` to the sidecar; no host port mapping needed.
      - BROWSER_CDP_URL=${BROWSER_CDP_URL-}
    ports:
      # OpenAI-compatible API server — host loopback only. hermes-desktop's
      # remote mode points here. For LAN access use SSH tunnel or Tailscale.
      - "127.0.0.1:8642:8642"
    # Bootstrap an API_SERVER_KEY into the named volume on first boot,
    # then exec `hermes gateway run`. Hermes refuses to bind 0.0.0.0
    # without a bearer key (`gateway.platforms.api_server.connect()`
    # explicitly rejects non-loopback hosts when `API_SERVER_KEY` is
    # unset or contains a placeholder value); container-internal
    # 0.0.0.0 is required because Docker port-mapping cannot reach a
    # container's loopback.
    #
    # The key file lives at `/opt/data/.api_server_key` (mode 600,
    # inside the named volume — host filesystem never sees it). To
    # retrieve the bearer for hermes-desktop / OpenWebUI:
    #   docker exec hermes cat /opt/data/.api_server_key
    #
    # To rotate: `docker exec hermes rm /opt/data/.api_server_key` then
    # `docker compose restart gateway` — a fresh key generates on next
    # start, and all clients re-pick the new value next time they ask.
    command:
      - sh
      - -c
      - |
        set -e
        KEYFILE=/opt/data/.api_server_key
        if [ ! -s "$$KEYFILE" ]; then
          python3 -c 'import secrets; print(secrets.token_hex(32))' > "$$KEYFILE"
          chmod 600 "$$KEYFILE"
        fi
        export API_SERVER_KEY="$$(cat $$KEYFILE)"
        exec /opt/hermes/.venv/bin/hermes gateway run

  dashboard:
    image: hermes-agent
    container_name: hermes-dashboard
    restart: unless-stopped
    depends_on:
      - gateway
    volumes:
      # Shares the same named volume as gateway (see file header).
      - "hermes-data:/opt/data"
    environment:
      - HERMES_UID=10000
      - HERMES_GID=10000
    ports:
      # Localhost-only. For remote access, SSH-tunnel: ssh -L 9119:localhost:9119
      - "127.0.0.1:9119:9119"
    command: ["dashboard", "--host", "0.0.0.0", "--no-open", "--insecure"]
    # `--insecure` rationale: same as gateway above. Dashboard binds 0.0.0.0
    # INSIDE the container; `ports:` only publishes to 127.0.0.1 on the host.

  # ──────────────────────────────────────────────────────────────────────────
  # Optional: CloakBrowser stealth Chromium sidecar
  #
  # https://github.com/CloakHQ/CloakBrowser — Chromium binary with 58
  # C++ source-level fingerprint patches. Passes Cloudflare Turnstile,
  # FingerprintJS, BrowserScan, and scores ~0.9 on reCAPTCHA v3.
  #
  # Opt-in: NOT started by `docker compose up -d`. Boot with
  #   docker compose -f docker-compose.windows.yml --profile browser up -d
  # The profile starts this service AND keeps gateway/dashboard up; Hermes
  # picks up the sidecar via the BROWSER_CDP_URL env wired into the gateway
  # service above.
  #
  # The image ships `cloakserve` — a CDP multiplexer that exposes Chromium
  # DevTools Protocol on port 9222, designed for Playwright
  # `connect_over_cdp`. Hermes' browser tool consumes the CDP URL natively
  # via `tools/browser_tool.py:_resolve_cdp_override()` (env > config.yaml
  # precedence), so no code changes are needed.
  #
  # License: wrapper MIT, binary is royalty-free for personal + commercial
  # use but NOT redistributable. See https://github.com/CloakHQ/CloakBrowser
  # BINARY-LICENSE.md before forking or rebuilding the image.
  # ──────────────────────────────────────────────────────────────────────────
  cloakbrowser:
    # TODO: pin to a SHA256 digest once chosen. See #21.
    image: cloakhq/cloakbrowser
    container_name: hermes-cloakbrowser
    # `restart: "no"` — explicit. The browser sidecar is opt-in; we don't
    # want Docker to auto-restart it on host reboot. The user re-enables
    # by re-running `docker compose --profile browser up -d`. (Compare
    # with gateway/dashboard's `unless-stopped` — those ARE meant to be
    # always-on.)
    restart: "no"
    profiles: ["browser"]
    # Chromium renderer crashes (`SIGBUS`, "Failed to create SharedMemory")
    # when /dev/shm is at Docker's default 64 MB. 256 MB is the common
    # recommendation that covers normal page loads + a few tabs.
    shm_size: '256m'
    # `cloakserve` listens on $PORT (default 9222) and routes incoming CDP
    # connections to per-fingerprint Chromium processes. The bundled
    # docker-entrypoint.sh starts Xvfb first (headed-mode required for
    # Turnstile passes), then execs this command.
    command: ["cloakserve", "--port=9222"]
    # No `ports:` block — cloakbrowser is only reachable from sibling
    # compose services on the default compose network. Host has no direct
    # access, which is intentional (the CDP endpoint is unauthenticated).
    # Hermes gateway reaches it via Docker DNS as `hermes-cloakbrowser:9222`.
    #
    # Lateral-movement note: any other service added to this compose file
    # (now or in the future) will also be able to reach this CDP endpoint
    # over the default network. CDP can navigate to arbitrary URLs and
    # read local files inside its sandbox — treat it like an unauthenticated
    # internal API. If you add a third service that doesn't need browser
    # access, put it on a separate `networks:` block to isolate.
    expose:
      - "9222"
    # Xvfb + cloakserve take ~5-15s to come up on cold start (especially
    # first run after image pull). Without this, gateway boots faster and
    # the first browser tool call lands before the CDP socket is open.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9222/json/version > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  hermes-data:
    # `name:` pins the actual Docker volume name. Without it, compose v2
    # prefixes top-level volumes with the project name (directory name by
    # default → `hermes-agent_hermes-data`). Pinning makes the volume name
    # invariant across compose / docker-cli call sites.
    name: hermes-data
    # No driver_opts — Docker manages the storage path. On Windows + Docker
    # Desktop this lives inside the WSL2 VM's ext4 filesystem; on Linux
    # hosts under /var/lib/docker/volumes/. Back up via
    # `docker exec hermes hermes backup` (zips /opt/data into a portable
    # archive) or via the alpine + tar pattern.
